<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#ffffff;
color:#222;
overflow-x:hidden;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
}

.gold{
color:#D4AF37;
}

.btn{
display:inline-block;
padding:16px 32px;
background:linear-gradient(135deg,#D4AF37,#F4D06F);
color:#111;
font-weight:600;
text-decoration:none;
border-radius:50px;
transition:.3s;
box-shadow:0 10px 25px rgba(212,175,55,.25);
}

.btn:hover{
transform:translateY(-2px);
}

header{
background:#fff;
position:sticky;
top:0;
z-index:999;
border-bottom:1px solid #eee;
}

.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 0;
}

.logo{
height:55px;
}

.hero{
padding:80px 0;
background:
linear-gradient(to bottom,#ffffff,#faf8f1);
}

.hero-content{
text-align:center;
max-width:850px;
margin:auto;
}

.hero h1{
font-size:48px;
font-weight:700;
line-height:1.2;
margin-bottom:20px;
}

.hero p{
font-size:18px;
color:#666;
line-height:1.8;
margin-bottom:35px;
}

.badges{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-top:35px;
}

.badge{
padding:10px 18px;
background:#fff;
border:1px solid #eee;
border-radius:50px;
font-size:14px;
box-shadow:0 5px 15px rgba(0,0,0,.04);
}

@media(max-width:768px){

.hero h1{
font-size:34px;
}

.hero p{
font-size:16px;
}

}

</style>
</head>

<body>

<header>
<div class="container nav">
